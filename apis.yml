apis:
  - aid: nanjing:idp-shibboleth
    name: Nanjing University Shibboleth Identity Provider (SAML 2.0 metadata)
    description: >-
      Nanjing University's own Shibboleth Identity Provider. It publishes SAML 2.0 metadata at
      the canonical /idp/shibboleth location — an EntityDescriptor with an IDPSSODescriptor and
      an AttributeAuthorityDescriptor, shibmd scope nju.edu.cn, SSO and SLO endpoints on 443 and
      SOAP attribute-query / artifact-resolution endpoints on 8443. The library uses it in
      production as the CARSI route to licensed resources off campus. Recorded honestly: the
      document NJU serves is Shibboleth's unedited sample metadata, validUntil 2020-02-17 and
      still carrying the shipped placeholder UIInfo, so the deployment is curated in CARSI's
      registration rather than on NJU's own host.
    humanURL: https://itsc.nju.edu.cn/
    baseURL: https://idp.nju.edu.cn/idp/
    x-operator: institution
    x-operator-evidence: >-
      idp.nju.edu.cn is under NJU's own registrable domain and resolves with no CNAME to
      219.219.122.95, APNIC netname CERNET-CN (China Education and Research Network, Nanjing
      Regional Network). No managed-IdP platform, CDN or vendor host sits between NJU and this
      metadata. Probed 2026-09-01: /idp/shibboleth 200 application/xml (14,402 bytes),
      /idp/profile/SAML2/Redirect/SSO 400 (correct rejection of a request with no SAMLRequest).
    tags: [Identity Federation, SAML, Shibboleth, Authentication]
    properties:
      - type: IdentityFederation
        url: https://idp.nju.edu.cn/idp/shibboleth
      - type: Documentation
        url: identity-federation/nanjing-identity-federation.yml
  - aid: nanjing:carsi-edugain
    name: Nanjing University CARSI / eduGAIN Federation Registration
    description: >-
      NJU's entry in CARSI (CERNET Authentication and Resource Sharing Infrastructure), China's
      national research and education identity federation, republished into eduGAIN. Entity id
      671521, entityID https://idp.nju.edu.cn/idp/shibboleth, display names "Nanjing University"
      and "南京大学(Nanjing University)", scope nju.edu.cn, roles IDPSSODescriptor and
      AttributeAuthorityDescriptor, first seen 2020-02-18. No REFEDS entity categories, Sirtfi or
      Code of Conduct assertions are declared on the entry.
    humanURL: https://www.carsi.edu.cn/
    baseURL: https://technical.edugain.org/api.php
    x-operator: federation
    x-operator-evidence: >-
      A federation is shared by definition and the IdP behind the entry is the institution's, so
      this is recorded as NJU's relationship rather than filtered out as a shared host. Probed
      2026-09-01: the eduGAIN technical database returned 725 CARSI entities (200,
      application/json) and exactly one scoped to nju.edu.cn — this one.
    tags: [Identity Federation, eduGAIN, CARSI, SAML]
    properties:
      - type: APIReference
        url: https://technical.edugain.org/api.php
      - type: Registration
        url: https://technical.edugain.org/api.php?action=list_entities&fed_id=CARSI&format=json
  - aid: nanjing:cas-sso
    name: Nanjing University Unified Identity Authentication (CAS SSO)
    description: >-
      NJU's central single sign-on, a CAS deployment supporting password, verification-code,
      biometric and QR-code login. It is not a developer API and there is no public service
      registration — a relying application must be registered by NJU IT — but the ticket
      validation endpoints do speak the CAS protocol to anonymous callers and return
      application/xml, which makes this a real machine-readable institution-operated surface
      rather than the login page the June 2026 profile recorded.
    humanURL: https://itsc.nju.edu.cn/itsc_en/68/6a/c26812a485482/page.htm
    baseURL: https://authserver.nju.edu.cn/authserver/
    x-operator: institution
    x-operator-evidence: >-
      authserver.nju.edu.cn resolves to 219.219.115.212, APNIC netname CERNET-CN. Probed
      2026-09-01: /authserver/login 200; /authserver/serviceValidate and /authserver/p3/serviceValidate
      both 200 application/xml returning <cas:serviceResponse> with
      <cas:authenticationFailure code="INVALID_TICKET">; /authserver/.well-known/openid-configuration
      404 (JSON) — no OIDC surface is published.
    tags: [Authentication, SSO, CAS, Identity]
    properties:
      - type: Documentation
        url: https://itsc.nju.edu.cn/itsc_en/68/6a/c26812a485482/page.htm
      - type: Authentication
        url: https://authserver.nju.edu.cn/authserver/login
  - aid: nanjing:mirrors
    name: NJU Mirror (open-source software mirror)
    description: >-
      The university's public open-source mirror, run by the NJU e-Science Center and open to
      anyone on the internet. Beyond the package trees themselves, the site serves JSON
      configuration endpoints that are ordinary unauthenticated reads: /configs/news/index.json
      (announcements), /configs/documentations/index.json (the mirrored-distribution help index,
      18.5KB), and /configs/cards/esci.json (the e-Science service directory). It does not publish
      a MirrorZ /mirrorz.json descriptor — that was probed and returns 404.
    humanURL: https://mirrors.nju.edu.cn/
    baseURL: https://mirrors.nju.edu.cn/configs/
    x-operator: institution
    x-operator-evidence: >-
      mirrors.nju.edu.cn resolves to 210.28.130.3 in CERNET-CN space, alongside the rest of the
      e-Science estate (git .14, doc/hpc .10, box .6, pass .11, table .18). Probed 2026-09-01:
      /configs/documentations/index.json 200 application/json, /configs/news/index.json 200
      application/json, /configs/cards/esci.json 200 application/json. The edge sets a bcheck
      cookie and 302s a first request back to itself; with the cookie every route answers.
    tags: [Open Source Mirror, Package Repository, Research Computing]
    properties:
      - type: APIReference
        url: https://mirrors.nju.edu.cn/configs/documentations/index.json
      - type: Documentation
        url: https://help.mirror.nju.edu.cn/
  - aid: nanjing:gitlab
    name: NJU e-Science Code Hosting (GitLab REST API v4)
    description: >-
      An institution-operated GitLab instance for NJU staff and students. Its REST API v4 is real
      and in production — the university's own mirror site fetches
      /api/v4/projects/2412/issues to render announcements — but non-browser clients currently
      meet an Anubis proof-of-work bot challenge on every /api/v4 route. The contract is GitLab's,
      not NJU's engineering, so no specification is saved here; the deployment is the surface.
    humanURL: https://git.nju.edu.cn/
    baseURL: https://git.nju.edu.cn/api/v4
    x-operator: institution
    x-operator-evidence: >-
      git.nju.edu.cn resolves to 210.28.130.14, CERNET-CN, on NJU's own domain, and is listed as
      "代码托管" in the e-Science service directory at
      https://mirrors.nju.edu.cn/configs/cards/esci.json. Probed 2026-09-01: /api/v4/version,
      /api/v4/metadata and /api/v4/projects/2412/issues each return HTTP 200 carrying the Anubis
      challenge page rather than the resource — live and gated, not dead.
    tags: [Version Control, GitLab, Developer Tools]
    properties:
      - type: APIReference
        url: https://git.nju.edu.cn/
  - aid: nanjing:doc-bookstack
    name: NJU e-Science Document Service API
    description: >-
      The e-Science Center's documentation platform (a BookStack deployment) publishes a complete
      public REST API reference at /api/docs — 79 endpoints across books, chapters, pages, shelves,
      attachments, images, users, roles, recycle bin, audit log, search and content permissions,
      with GET, POST, PUT and DELETE. This is the only surface in the profile that documents an API
      to the public. The API itself is token-gated and returns a clean JSON error envelope
      unauthenticated; tokens are issued from an NJU account profile, so an outsider cannot obtain
      one. The machine-readable description at /api/docs.json sits behind the same token.
    humanURL: https://doc.nju.edu.cn/api/docs
    baseURL: https://doc.nju.edu.cn/api
    x-operator: institution
    x-operator-evidence: >-
      doc.nju.edu.cn resolves to 210.28.130.10, CERNET-CN, and is branded "e-Science Document";
