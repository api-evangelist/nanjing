aid: nanjing
name: Nanjing University
description: >-
  Nanjing University (NJU, 南京大学), founded in 1902 in Nanjing, Jiangsu, is one of China's
  oldest research universities and a member of the C9 League. It publishes no developer
  portal, no API gateway, no API programme and no OpenAPI of its own, and this profile
  records that plainly. What it does operate — directly, on its own hosts, inside CERNET
  address space — is a genuine estate of institution-run machine-readable surfaces, almost
  all of it built and run by the university's e-Science Center: its own Shibboleth identity
  provider at idp.nju.edu.cn, registered in CARSI and republished to eduGAIN; a CAS single
  sign-on service whose ticket-validation endpoints answer the CAS 2.0 and 3.0 protocol to
  anonymous callers; a public open-source mirror at mirrors.nju.edu.cn serving JSON
  configuration endpoints; a GitLab instance at git.nju.edu.cn whose REST API v4 the mirror
  site itself consumes; a BookStack documentation service at doc.nju.edu.cn that publishes a
  complete 79-endpoint REST API reference publicly and gates the API on an NJU token; and
  Seafile, SeaTable and Vaultwarden deployments that answer unauthenticated service-discovery
  JSON. None of this is an API product, none of it is registerable by an outsider, and the
  contracts behind the service deployments are the upstream products', not NJU's engineering —
  so no vendor specification is saved here under NJU's name. The June 2026 profile of this
  institution saw none of it and recorded only a login page.
