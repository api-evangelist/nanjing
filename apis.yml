      /api/docs.json 401. The contract shape is BookStack's; the deployment and its content are
      NJU's, so the surface is recorded and the product's generic specification is not.
    tags: [Documentation, Content API, Research Computing]
    properties:
      - type: APIReference
        url: https://doc.nju.edu.cn/api/docs
      - type: Documentation
        url: https://doc.nju.edu.cn/
