x-coverage:
  state: covered
  reason: covered
  detail: >-
    Nanjing University operates a real, verified estate of institution-run machine-readable
    surfaces, all of it probed live on 2026-09-01 and all of it on hosts inside CERNET address
    space under nju.edu.cn: its own Shibboleth IdP (registered in CARSI and eduGAIN since
    2020-02-18), CAS ticket validation answering the CAS 2.0/3.0 protocol anonymously, the NJU
    Mirror JSON configuration endpoints, a GitLab REST API v4 the university's own site consumes,
    a BookStack service publishing 79 documented REST endpoints and gating them on an NJU token,
    and Seafile / SeaTable / Vaultwarden deployments answering unauthenticated service-discovery
    JSON. What NJU does not have is equally definite and is stated rather than padded: no
    developer portal, no API gateway, no API key or client registration, no published API terms,
    no OpenAPI, no robots.txt, no sitemap.xml, no llms.txt and no .well-known/security.txt on the
    main site (all 404), no OIDC discovery on the CAS server, no OAI-PMH endpoint, no DataCite or
    Crossref membership, and no institutional repository host that resolves. Three surfaces are
    gated rather than absent and are recorded as findings: the library OPAC is restricted to the
    campus network (403, "use the NJU VPN"), git.nju.edu.cn answers non-browser clients with an
    Anubis bot challenge, and data.nju.edu.cn and elearning.nju.edu.cn return HTTP 483 maintenance
    pages from an edge WAF. One vendor tenancy the library still links — the Summon discovery
    instance at nju.summon.serialssolutions.com — returns 404 on every path and was therefore not
    recorded as a live surface. No vendor contract is saved under NJU's name: the Seafile,
    SeaTable, Vaultwarden, GitLab and BookStack contracts belong to those products, and only the
    deployments are credited here. On AI, NJU's public posture is curricular rather than
    regulatory — it launched mandatory AI general-education core courses for the class of 2028 in
    September 2024 and runs its own assistant platform at chat.nju.edu.cn — but no
    institution-wide generative-AI usage policy was found on a public NJU surface in either
    English or Chinese, so no AIPolicy pointer is claimed.
  evidence:
    - url: https://idp.nju.edu.cn/idp/shibboleth
      status: 200
      note: SAML 2.0 EntityDescriptor, application/xml — but unedited Shibboleth sample metadata, validUntil 2020-02-17
    - url: https://technical.edugain.org/api.php?action=list_entities&fed_id=CARSI&format=json
      status: 200
      note: NJU registered in CARSI/eduGAIN, entityID https://idp.nju.edu.cn/idp/shibboleth, scope nju.edu.cn
    - url: https://authserver.nju.edu.cn/authserver/p3/serviceValidate?service=https%3A%2F%2Fexample.org%2F&ticket=ST-test
      status: 200
      note: CAS 3.0 protocol XML to an anonymous caller
    - url: https://mirrors.nju.edu.cn/configs/documentations/index.json
      status: 200
      note: 18.5KB application/json, unauthenticated
    - url: https://doc.nju.edu.cn/api/docs
      status: 200
      note: public 79-endpoint REST API reference
