source: >-
  Live fetch of https://idp.nju.edu.cn/idp/shibboleth (SAML 2.0 EntityDescriptor, HTTP 200,
  application/xml, 14,402 bytes), archived verbatim at
  identity-federation/nanjing-idp-saml-metadata.xml; the eduGAIN technical database
  (https://technical.edugain.org/api.php?action=list_entities&fed_id=CARSI&format=json,
