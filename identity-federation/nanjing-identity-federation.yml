service_provider_usage:
  detail: >-
    Nanjing University Library publishes CARSI/Shibboleth as the off-campus route to
    licensed resources, and links https://idp.nju.edu.cn/idp/shibboleth directly from
    https://lib.nju.edu.cn/ (200, probed 2026-09-01), alongside vendor federation entry
    points such as https://signon.thomsonreuters.com/federation/CARSI. This is the
    institution using its own IdP in production, corroborated on an institution-operated
    page.
