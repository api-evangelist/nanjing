  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, with operator attribution settled
      before anything was saved. The June 2026 review's conclusion — "no public API endpoints,
      developer documentation, signup, or client registration were found" — was too broad. It is
      correct that Nanjing University runs no API programme: no developer portal, no gateway, no key
      or client registration, no published API terms, no OpenAPI, and no robots.txt, sitemap.xml,
      llms.txt or .well-known/security.txt on the main site (all 404). But NJU's e-Science Center
      operates a real estate of institution-run, machine-readable surfaces that the first pass never
      probed, every one of them on nju.edu.cn hosts inside CERNET address space with no vendor CNAME:
      its own Shibboleth identity provider registered in CARSI and eduGAIN; CAS ticket validation
      answering the CAS 2.0/3.0 protocol in XML to anonymous callers; the NJU Mirror JSON
      configuration endpoints; a GitLab REST API v4 that the university's own mirror site consumes;
      a BookStack documentation service publishing a 79-endpoint REST reference publicly and gating
      the API on an NJU token; and Seafile, SeaTable and Vaultwarden deployments answering
      unauthenticated service-discovery JSON.

      No vendor contract was saved under NJU's name. The GitLab, BookStack, Seafile, SeaTable and
      Vaultwarden APIs are those products' engineering; only NJU's deployments are recorded. The one
      vendor tenancy the library still links, the Summon discovery instance at
      nju.summon.serialssolutions.com, is dead (404 on every path) and was not recorded as a live
      surface. Two identifier-registry memberships are recorded as facts about the institution: ROR
      01rxvg760 and Crossref Open Funder Registry 501100008048. NJU is not a Crossref member and not
      a DataCite client; the only Crossref member matching a "Nanjing University" query is Nanjing
      University of Aeronautics and Astronautics, a different institution, and it was deliberately
      not attributed here.

      Three surfaces are gated rather than absent, which is a finding and not a gap: the library OPAC
      returns 403 "请使用南大VPN访问!" on every route including an OAI-PMH probe; git.nju.edu.cn answers
      non-browser clients with an Anubis proof-of-work bot challenge; and data.nju.edu.cn and
      elearning.nju.edu.cn return HTTP 483 WAF maintenance pages that could not be read from outside
      China. One host is a false lead worth naming: api.nju.edu.cn resolves and returns HTTP 200, and
      the body is the stock Apache Tomcat 8.5.98 welcome page — an unconfigured container, not an API.
